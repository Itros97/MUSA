name: Publish documents
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: akrck02/papiro-deploy@main
        with:
          title: "MUSA"
          description: "A local-first inventory and business app for digital artists who also sell physical stock."
          accent: "#9A4532"
          path: "./docs"
          isObsidianProject: false
          showFooter: true
          showBreadcrumb: true
          showStartPage: true
      - name: Deploy to github pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
